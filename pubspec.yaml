name: muster_sport
description: MUSTER Sport — University Sports Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.2
  google_fonts: ^8.0.2
  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/users_cache.json
    # Font licence texts (SIL OFL 1.1) surfaced in Settings → Open Source Licenses.
    - assets/fonts/LICENSES.md
    - assets/fonts/Cairo/OFL.txt
    - assets/fonts/Noto_Sans_Arabic/OFL.txt
    - assets/fonts/Poppins/OFL.txt
